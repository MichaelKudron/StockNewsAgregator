services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  newsdownload:
    image: ghcr.io/michaelkudron/stocknewsagregator-newsdownload:${APP_VERSION}
    restart: unless-stopped
    expose:
      - "8003"

  analysis:
    image: ghcr.io/michaelkudron/stocknewsagregator-analysis:${APP_VERSION}
    restart: unless-stopped
    expose:
      - "8004"
    volumes:
      - hfcache:/root/.cache/huggingface

  companyservice:
    image: ghcr.io/michaelkudron/stocknewsagregator-companyservice:${APP_VERSION}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stocks
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy

  articleservice:
    image: ghcr.io/michaelkudron/stocknewsagregator-articleservice:${APP_VERSION}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/articles
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICES_COMPANY: http://companyservice:8081
      SERVICES_ANALYSIS: http://analysis:8004
      SERVICES_NEWSDOWNLOAD: http://newsdownload:8003
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      companyservice:
        condition: service_started
      analysis:
        condition: service_started
      newsdownload:
        condition: service_started

  gateway:
    image: ghcr.io/michaelkudron/stocknewsagregator-gateway:${APP_VERSION}
    restart: unless-stopped
    environment:
      GATEWAY_ARTICLE_URI: http://articleservice:8080
      GATEWAY_COMPANY_URI: http://companyservice:8081
    expose:
      - "8080"
    depends_on:
      - articleservice
      - companyservice

  frontend:
    image: ghcr.io/michaelkudron/stocknewsagregator-frontend:${APP_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  hfcache: