services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  newsdownload:
    build: ./NewsDownloadService
    ports:
      - "8003:8003"

  analysis:
    build: ./StockNewsAnalysisService
    ports:
      - "8004:8004"
    volumes:
      - hfcache:/root/.cache/huggingface   # cache modelu między restartami

  companyservice:
    build: ./CompanyService
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stocks
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy

  articleservice:
    build: ./ArticleService
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/articles
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVICES_COMPANY: http://companyservice:8081
      SERVICES_ANALYSIS: http://analysis:8004
      SERVICES_NEWSDOWNLOAD: http://newsdownload:8003
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      companyservice:
        condition: service_started
      analysis:
        condition: service_started
      newsdownload:
        condition: service_started

  gateway:
    build: ./Gateway
    environment:
      GATEWAY_ARTICLE_URI: http://articleservice:8080
      GATEWAY_COMPANY_URI: http://companyservice:8081
    ports:
      - "8080:8080"
    depends_on:
      - articleservice
      - companyservice

  frontend:
    build: ./Frontend
    ports:
      - "4200:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  hfcache:
