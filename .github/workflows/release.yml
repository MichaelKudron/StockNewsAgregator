name: Build release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: michaelkudron

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newsdownload
            context: ./NewsDownloadService

          - name: analysis
            context: ./StockNewsAnalysisService

          - name: companyservice
            context: ./CompanyService

          - name: articleservice
            context: ./ArticleService

          - name: gateway
            context: ./Gateway

          - name: frontend
            context: ./Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stocknewsagregator-${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/stocknewsagregator-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max